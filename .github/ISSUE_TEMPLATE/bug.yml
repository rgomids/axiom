name: Bug
description: Report a reproducible defect or incorrect observable behavior in an available Axiom artifact.
labels:
  - type:bug
body:
  - type: markdown
    attributes:
      value: |
        An Issue does not represent approval, change the roadmap, or authorize implementation.
        Issue labels, status, closure, PR merge, and green CI do not advance canonical Axiom workflow state or establish human acceptance.
        Do not include secrets, credentials, private data, or unsanitized logs. Report suspected vulnerabilities privately using [SECURITY.md](https://github.com/rgomids/axiom/blob/main/SECURITY.md), never through this form.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Primary area. Maintainers may add a second area only when it improves classification.
      options:
        - CLI
        - Skills
        - Work Item
        - Workflow
        - Runtime
        - Execution
        - Installer
        - CI/CD
        - Governance
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Select every affected platform, or "Not platform-specific".
      multiple: true
      options:
        - Not platform-specific
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Summarize the problem and affected artifact.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide minimal steps using synthetic data and identify the commit or version.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant OS, Go, Bash, and tool versions; omit personal paths and identifiers.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or Evidence
      description: Include only sanitized output or a minimal synthetic reproduction. State if none is available.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Explain what is blocked and any known workaround, without private information.
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing Issues for duplicates.
          required: true
        - label: I removed secrets, credentials, private data, and sensitive vulnerability details.
          required: true
