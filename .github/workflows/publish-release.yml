name: Publish release
# PUBLISH phase. The only workflow that creates tags and GitHub Releases. It
# runs only when a maintainer dispatches it from main with the exact tag,
# revision, prepared run (release-artifacts.yml) and the preview_digest a
# human authorized. It never rebuilds: it downloads the prepared artifact of
# that run, re-verifies it at the revision, recomputes the publication
# envelope and stops unless its digest equals the authorized one. The publish
# job also waits for approval of the protected `release` environment.
# Order: verify prepared set -> envelope == authorized digest -> delivery
# preflight -> draft -> assets -> read-back -> publish -> read-back -> the
# envelope's Issue effects (release record, Project status, closure) for a
# stable release. Reruns converge; conflicts and changed previews fail closed
# before any effect.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N)
        required: true
        type: string
      revision:
        description: Full 40-character commit SHA on main to publish
        required: true
        type: string
      prepared_run:
        description: Run id of the release-artifacts.yml run whose artifact is published
        required: true
        type: string
      preview_digest:
        description: preview_digest of the publication envelope a human authorized
        required: true
        type: string

      corrections_revision:
        description: Optional full SHA on main containing reviewed recovery corrections and release control scripts
        required: false
        type: string
      corrections_digest:
        description: SHA-256 of committed delivery-corrections.txt at corrections_revision
        required: false
        type: string

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: read
    steps:
      - name: Require dispatch from main and well-formed inputs
        env:
          DISPATCH_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_REVISION: ${{ inputs.revision }}
          PREPARED_RUN: ${{ inputs.prepared_run }}
          PREVIEW_DIGEST: ${{ inputs.preview_digest }}
        run: |
          [[ "$DISPATCH_REF" == refs/heads/main ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]
          [[ "$RELEASE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PREPARED_RUN" =~ ^[0-9]+$ ]]
          [[ "$PREVIEW_DIGEST" =~ ^[0-9a-f]{64}$ ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
          persist-credentials: false
          path: source
      - name: Checkout pinned recovery control
        if: inputs.corrections_revision != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.corrections_revision }}
          fetch-depth: 0
          persist-credentials: false
          path: control
      - name: Select release control scripts
        env:
          CORRECTIONS_REVISION: ${{ inputs.corrections_revision }}
          CORRECTIONS_DIGEST: ${{ inputs.corrections_digest }}
        run: |
          scripts="$GITHUB_WORKSPACE/source/scripts"
          if [[ -n "$CORRECTIONS_REVISION$CORRECTIONS_DIGEST" ]]; then
            [[ "$CORRECTIONS_REVISION" =~ ^[0-9a-f]{40}$ && "$CORRECTIONS_DIGEST" =~ ^[0-9a-f]{64}$ ]]
            [[ $(git -C "$GITHUB_WORKSPACE/control" rev-parse HEAD) == "$CORRECTIONS_REVISION" ]]
            git -C "$GITHUB_WORKSPACE/control" rev-list --first-parent origin/main | grep -Fx "$CORRECTIONS_REVISION" >/dev/null
            git -C "$GITHUB_WORKSPACE/control" merge-base --is-ancestor "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)" "$CORRECTIONS_REVISION"
            scripts="$GITHUB_WORKSPACE/control/scripts"
          fi
          {
            printf 'RELEASE_CONTROL_SCRIPTS=%s\n' "$scripts"
            printf 'AXIOM_RELEASE_CORRECTIONS_REVISION=%s\n' "$CORRECTIONS_REVISION"
            printf 'AXIOM_RELEASE_CORRECTIONS_DIGEST=%s\n' "$CORRECTIONS_DIGEST"
          } >>"$GITHUB_ENV"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: source/go.mod
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: axiom-release-${{ inputs.tag }}
          path: ${{ runner.temp }}/prepared
          run-id: ${{ inputs.prepared_run }}
          github-token: ${{ github.token }}
      - name: Verify the prepared set at the revision
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_REVISION: ${{ inputs.revision }}
          PREPARED_RUN: ${{ inputs.prepared_run }}
        working-directory: source
        run: |
          [[ $(git rev-parse --verify HEAD) == "$RELEASE_REVISION" ]]
          "$RELEASE_CONTROL_SCRIPTS/verify-prepared-release.sh" --tag "$RELEASE_TAG" --revision "$RELEASE_REVISION" \
            --prepared "$RUNNER_TEMP/prepared" --repo "$GITHUB_REPOSITORY" --run "$PREPARED_RUN" | tee -a "$GITHUB_STEP_SUMMARY"

  publish:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
          persist-credentials: false
          path: source
      - name: Checkout pinned recovery control
        if: inputs.corrections_revision != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.corrections_revision }}
          fetch-depth: 0
          persist-credentials: false
          path: control
      - name: Select release control scripts
        env:
          CORRECTIONS_REVISION: ${{ inputs.corrections_revision }}
          CORRECTIONS_DIGEST: ${{ inputs.corrections_digest }}
        run: |
          scripts="$GITHUB_WORKSPACE/source/scripts"
          if [[ -n "$CORRECTIONS_REVISION$CORRECTIONS_DIGEST" ]]; then
            [[ "$CORRECTIONS_REVISION" =~ ^[0-9a-f]{40}$ && "$CORRECTIONS_DIGEST" =~ ^[0-9a-f]{64}$ ]]
            [[ $(git -C "$GITHUB_WORKSPACE/control" rev-parse HEAD) == "$CORRECTIONS_REVISION" ]]
            git -C "$GITHUB_WORKSPACE/control" rev-list --first-parent origin/main | grep -Fx "$CORRECTIONS_REVISION" >/dev/null
            git -C "$GITHUB_WORKSPACE/control" merge-base --is-ancestor "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)" "$CORRECTIONS_REVISION"
            scripts="$GITHUB_WORKSPACE/control/scripts"
          fi
          {
            printf 'RELEASE_CONTROL_SCRIPTS=%s\n' "$scripts"
            printf 'AXIOM_RELEASE_CORRECTIONS_REVISION=%s\n' "$CORRECTIONS_REVISION"
            printf 'AXIOM_RELEASE_CORRECTIONS_DIGEST=%s\n' "$CORRECTIONS_DIGEST"
          } >>"$GITHUB_ENV"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: source/go.mod
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: axiom-release-${{ inputs.tag }}
          path: ${{ runner.temp }}/prepared
          run-id: ${{ inputs.prepared_run }}
          github-token: ${{ github.token }}
      - name: Read the delivery projection of the revision
        id: delivery
        working-directory: source
        run: |
          projection=disabled
          if [[ -f .github/delivery-project.json ]] && jq -e '.projection == "enabled"' .github/delivery-project.json >/dev/null; then
            projection=enabled
          fi
          printf 'projection=%s\n' "$projection" >>"$GITHUB_OUTPUT"
      - name: Re-verify, match the authorized envelope, then publish
        env:
          # Environment-scoped fine-grained PAT: historical source workflows
          # differ from main, requiring Workflows: write unavailable to GITHUB_TOKEN.
          GH_TOKEN: ${{ secrets.AXIOM_RELEASE_PUBLISH_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_REVISION: ${{ inputs.revision }}
          PREPARED_RUN: ${{ inputs.prepared_run }}
          PREVIEW_DIGEST: ${{ inputs.preview_digest }}
          # Classic PAT (project scope) for the user-owned delivery Project;
          # a release environment secret, used only for Projects v2 GraphQL
          # and only when .github/delivery-project.json at the revision sets
          # "projection": "enabled". Repository effects use the publication PAT.
          AXIOM_DELIVERY_PROJECT_TOKEN: ${{ steps.delivery.outputs.projection == 'enabled' && secrets.AXIOM_DELIVERY_PROJECT_TOKEN || '' }}
        working-directory: source
        run: |
          [[ -n "$GH_TOKEN" ]] || { printf 'release_publish_error: AXIOM_RELEASE_PUBLISH_TOKEN is unavailable\n' >&2; exit 1; }
          [[ $(git rev-parse --verify HEAD) == "$RELEASE_REVISION" ]]
          prepared="$RUNNER_TEMP/prepared"
          # Main, tags and the prepared set may have changed since preflight.
          "$RELEASE_CONTROL_SCRIPTS/verify-prepared-release.sh" --tag "$RELEASE_TAG" --revision "$RELEASE_REVISION" \
            --prepared "$prepared" --repo "$GITHUB_REPOSITORY" --run "$PREPARED_RUN" >"$RUNNER_TEMP/prepared.txt"
          make_latest=$(awk -F= '$1 == "make_latest" {print $2}' "$RUNNER_TEMP/prepared.txt")
          # publish-release.sh recomputes the envelope from these exact files and
          # the current remote state and refuses before any effect unless it
          # equals the authorized preview_digest.
          "$RELEASE_CONTROL_SCRIPTS/publish-release.sh" --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --revision "$RELEASE_REVISION" \
            --make-latest "$make_latest" --prepared-run "$PREPARED_RUN" --dir "$prepared/artifacts" \
            --evidence "$prepared/release-evidence.txt" --notes "$prepared/release-notes.md" \
            --authorized-digest "$PREVIEW_DIGEST" | tee "$RUNNER_TEMP/publication.txt"
          cat "$RUNNER_TEMP/publication.txt" >>"$GITHUB_STEP_SUMMARY"
