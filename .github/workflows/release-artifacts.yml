name: Release artifacts
# PREPARE phase of a release. Builds the complete supported Axiom artifact set
# from one exact, preflighted revision, verifies it, renders the release notes
# and retains exactly these bytes as the workflow artifact
# `axiom-release-<tag>`. The publication envelope that a human authorizes is
# computed from this artifact, and the publication workflow publishes these same
# bytes: nothing is rebuilt after authorization.
# Preparation only: read-only token; this workflow never creates tags,
# GitHub Releases or prereleases, never changes `latest`, and never writes to
# the repository. Cross-built artifacts are not native target acceptance (T24).
# Release-candidate acceptance (Issue #238, ADR-0019 Alternative D): for a
# stable tag (FR-069), the `accept` jobs run the prepared-set upgrade journeys
# natively per blocking row on exactly the retained bytes, never rebuilding or
# modifying them, and
# retain each axiom-gate-evidence/v1 document as its own artifact
# `axiom-acceptance-<tag>-<row>`; `acceptance-evidence` verifies them as
# publication will. This run succeeds only when every row passes. Acceptance
# only produces Evidence: publication authority stays with the human-authorized
# envelope, which binds the digest of each Evidence document.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Public release tag to prepare (vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N); no tag is created
        required: true
        type: string
      revision:
        description: Full 40-character commit SHA on main to build
        required: true
        type: string

      corrections_revision:
        description: Optional full SHA on main containing reviewed recovery corrections and release control scripts
        required: false
        type: string
      corrections_digest:
        description: SHA-256 of committed delivery-corrections.txt at corrections_revision
        required: false
        type: string

permissions:
  contents: read
  # Stable notes list the delivered Issues with their titles.
  issues: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-artifacts-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      revision: ${{ steps.identity.outputs.revision }}
      sha256sums: ${{ steps.identity.outputs.sha256sums }}
      channel: ${{ steps.identity.outputs.channel }}
    steps:
      - name: Require dispatch from main
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: '[[ "$DISPATCH_REF" == refs/heads/main ]]'
      - name: Validate inputs
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_REVISION: ${{ inputs.revision }}
        run: |
          # Strict shape before GITHUB_ENV; release-preflight.sh applies the full rules.
          [[ "$RELEASE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]
          {
            printf 'RELEASE_TAG=%s\n' "$RELEASE_TAG"
            printf 'RELEASE_REVISION=%s\n' "$RELEASE_REVISION"
          } >>"$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_REVISION }}
          fetch-depth: 0
          persist-credentials: false
          path: source
      - name: Checkout pinned recovery control
        if: inputs.corrections_revision != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.corrections_revision }}
          fetch-depth: 0
          persist-credentials: false
          path: control
      - name: Select release control scripts
        env:
          CORRECTIONS_REVISION: ${{ inputs.corrections_revision }}
          CORRECTIONS_DIGEST: ${{ inputs.corrections_digest }}
        run: |
          scripts="$GITHUB_WORKSPACE/source/scripts"
          if [[ -n "$CORRECTIONS_REVISION$CORRECTIONS_DIGEST" ]]; then
            [[ "$CORRECTIONS_REVISION" =~ ^[0-9a-f]{40}$ && "$CORRECTIONS_DIGEST" =~ ^[0-9a-f]{64}$ ]]
            [[ $(git -C "$GITHUB_WORKSPACE/control" rev-parse HEAD) == "$CORRECTIONS_REVISION" ]]
            git -C "$GITHUB_WORKSPACE/control" rev-list --first-parent origin/main | grep -Fx "$CORRECTIONS_REVISION" >/dev/null
            git -C "$GITHUB_WORKSPACE/control" merge-base --is-ancestor "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)" "$CORRECTIONS_REVISION"
            scripts="$GITHUB_WORKSPACE/control/scripts"
          fi
          {
            printf 'RELEASE_CONTROL_SCRIPTS=%s\n' "$scripts"
            printf 'AXIOM_RELEASE_CORRECTIONS_REVISION=%s\n' "$CORRECTIONS_REVISION"
            printf 'AXIOM_RELEASE_CORRECTIONS_DIGEST=%s\n' "$CORRECTIONS_DIGEST"
          } >>"$GITHUB_ENV"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: source/go.mod
          cache: false
      - name: Preflight exact tag and revision
        working-directory: source
        run: |
          [[ $(git rev-parse --verify HEAD) == "$RELEASE_REVISION" ]]
          [[ -z $(git status --porcelain --untracked-files=normal) ]]
          out="$RUNNER_TEMP/axiom-release"
          mkdir -p "$out"
          ./scripts/release-preflight.sh --tag "$RELEASE_TAG" --revision "$RELEASE_REVISION" --main-ref origin/main >"$out/preflight.txt"
          version=$(awk -F= '$1 == "version" {print $2}' "$out/preflight.txt")
          printf 'RELEASE_VERSION=%s\n' "$version" >>"$GITHUB_ENV"
      - name: Verify module sources
        working-directory: source
        run: go mod verify
      - name: Build supported release archives
        working-directory: source
        run: ./scripts/build-release-archives.sh --version "$RELEASE_VERSION" --output "$RUNNER_TEMP/axiom-release/artifacts"
      - name: Verify complete artifact set and render notes
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: source
        run: |
          out="$RUNNER_TEMP/axiom-release"
          if [[ -n "$AXIOM_RELEASE_CORRECTIONS_REVISION" ]]; then
            "$RELEASE_CONTROL_SCRIPTS/release-corrections.sh" --source-revision "$RELEASE_REVISION" \
              --corrections-revision "$AXIOM_RELEASE_CORRECTIONS_REVISION" \
              --corrections-digest "$AXIOM_RELEASE_CORRECTIONS_DIGEST" >"$out/release-recovery.txt"
          fi
          ./scripts/verify-release-artifacts.sh --dir "$out/artifacts" --version "$RELEASE_VERSION" --revision "$RELEASE_REVISION" >"$out/release-evidence.txt"
          "$RELEASE_CONTROL_SCRIPTS/release-notes.sh" --tag "$RELEASE_TAG" --revision "$RELEASE_REVISION" --repo "$GITHUB_REPOSITORY" >"$out/release-notes.md"
          {
            printf 'tag=%s\n' "$RELEASE_TAG"
            printf 'revision=%s\n' "$RELEASE_REVISION"
            printf 'workflowRun=%s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'workflowRunAttempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'workflowRef=%s\n' "$GITHUB_WORKFLOW_REF"
            printf 'go=%s\n' "$(go env GOVERSION)"
          } >"$out/prepare-metadata.txt"
          [[ -z $(git status --porcelain --untracked-files=normal) ]]
          cat "$out/release-evidence.txt" >>"$GITHUB_STEP_SUMMARY"
      - name: Record the prepared identity
        id: identity
        run: |
          # The pin acceptance verifies before executing anything.
          sums=$(sha256sum "$RUNNER_TEMP/axiom-release/artifacts/SHA256SUMS" | awk '{print $1}')
          grep -Fxq "sha256sums=$sums" "$RUNNER_TEMP/axiom-release/release-evidence.txt"
          channel=$(awk -F= '$1 == "channel" {print $2}' "$RUNNER_TEMP/axiom-release/preflight.txt")
          [[ "$channel" == stable || "$channel" == rc ]]
          {
            printf 'tag=%s\n' "$RELEASE_TAG"
            printf 'revision=%s\n' "$RELEASE_REVISION"
            printf 'sha256sums=%s\n' "$sums"
            printf 'channel=%s\n' "$channel"
          } >>"$GITHUB_OUTPUT"
      - name: Retain the prepared set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: axiom-release-${{ env.RELEASE_TAG }}
          path: ${{ runner.temp }}/axiom-release
          if-no-files-found: error
          retention-days: 30

  accept:
    # Release-candidate acceptance of the exact prepared bytes on a native host
    # of each blocking row. The harness and its checks come from this
    # workflow's own main revision; the subject is only the retained set.
    needs: prepare
    # Blocking for stable releases (FR-069); a release candidate needs none.
    if: needs.prepare.outputs.channel == 'stable'
    name: accept-${{ matrix.gate }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: linux-amd64
            runner: ubuntu-24.04
            row: linux-amd64
          - gate: macos-arm64
            runner: macos-15
            row: macos-27-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Pin the prepared identity
        env:
          PREPARED_TAG: ${{ needs.prepare.outputs.tag }}
          PREPARED_REVISION: ${{ needs.prepare.outputs.revision }}
          PREPARED_SHA256SUMS: ${{ needs.prepare.outputs.sha256sums }}
        run: |
          [[ "$PREPARED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]
          [[ "$PREPARED_REVISION" =~ ^[0-9a-f]{40}$ && "$PREPARED_SHA256SUMS" =~ ^[0-9a-f]{64}$ ]]
          {
            printf 'PREPARED_TAG=%s\n' "$PREPARED_TAG"
            printf 'PREPARED_REVISION=%s\n' "$PREPARED_REVISION"
            printf 'PREPARED_SHA256SUMS=%s\n' "$PREPARED_SHA256SUMS"
          } >>"$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Download the prepared set of this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: axiom-release-${{ env.PREPARED_TAG }}
          path: ${{ runner.temp }}/prepared
      - name: Fetch the supported upgrade sources
        env:
          ROW: ${{ matrix.row }}
        run: |
          # Public release assets only. N is the newest stable tag other than
          # the candidate (a tag exists only for a published release; an
          # unpublished one fails the download closed).
          latest=$(git for-each-ref --format='%(refname:short)' 'refs/tags/v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -vxF "$PREPARED_TAG" | sort -V | tail -n 1)
          [[ -n "$latest" ]]
          for tag in "$latest" v0.1.1; do
            dir="$RUNNER_TEMP/previous-$tag"
            mkdir -p "$dir"
            version=${tag#v}
            for asset in SHA256SUMS "axiom-$version-$ROW.tar.gz"; do
              curl -fsSL --retry 4 -o "$dir/$asset" "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$asset"
            done
            printf 'PREVIOUS_%s=%s\n' "${tag//./_}" "$dir" >>"$GITHUB_ENV"
          done
          printf 'PREVIOUS_LATEST=%s\n' "$RUNNER_TEMP/previous-$latest" >>"$GITHUB_ENV"
      - name: Build the historical POC binary
        run: |
          mkdir -p "$RUNNER_TEMP/poc"
          git archive v0.1.0-poc.1 | tar -x -C "$RUNNER_TEMP/poc"
          (cd "$RUNNER_TEMP/poc" && go build -trimpath -o "$RUNNER_TEMP/poc-lingo" ./cmd/lingo)
      - name: Accept the exact prepared bytes
        env:
          AXIOM_EVIDENCE_RUNNER_LABEL: ${{ matrix.runner }}
          ROW: ${{ matrix.row }}
        run: |
          prepared="$RUNNER_TEMP/prepared"
          inventory() { (cd "$prepared" && find . -print | LC_ALL=C sort && find . -type f -exec shasum -a 256 {} + | LC_ALL=C sort); }
          inventory >"$RUNNER_TEMP/prepared-before.txt"
          mkdir "$RUNNER_TEMP/acceptance"
          status=0
          ./scripts/test-upgrade-journeys.sh --prepared-set "$prepared/artifacts" --candidate-acceptance \
            --tag "$PREPARED_TAG" --revision "$PREPARED_REVISION" --row "$ROW" --sha256sums-sha256 "$PREPARED_SHA256SUMS" \
            --previous "$PREVIOUS_LATEST" --previous "$PREVIOUS_v0_1_1" --poc-binary "$RUNNER_TEMP/poc-lingo" \
            --evidence "$RUNNER_TEMP/acceptance/gate-evidence.json" | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          # Acceptance never modifies the subject it accepts.
          inventory | cmp -s - "$RUNNER_TEMP/prepared-before.txt" \
            || { printf 'acceptance_error: the prepared set changed during acceptance\n' >&2; exit 1; }
          printf 'prepared_inputs=byte_identical\n' | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Validate the acceptance Evidence
        run: python3 scripts/gate-evidence.py validate "$RUNNER_TEMP/acceptance/gate-evidence.json"
      - name: Retain the acceptance Evidence
        # Failing Evidence is retained too, under a name used once per run, and
        # a failed attempt fails the run that publication requires to have
        # succeeded. Retry policy belongs to Slice 11.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: axiom-acceptance-${{ env.PREPARED_TAG }}-${{ matrix.row }}
          path: ${{ runner.temp }}/acceptance/gate-evidence.json
          if-no-files-found: ignore
          retention-days: 30

  acceptance-evidence:
    # Verifies, within this run, exactly what publication will verify: every
    # blocking row retained passing Evidence bound to the prepared set of this
    # run. Prints the Evidence digests the publication envelope binds.
    needs: [prepare, accept]
    if: needs.prepare.outputs.channel == 'stable'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Pin the prepared identity
        env:
          PREPARED_TAG: ${{ needs.prepare.outputs.tag }}
          PREPARED_REVISION: ${{ needs.prepare.outputs.revision }}
        run: |
          [[ "$PREPARED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ && "$PREPARED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          printf 'PREPARED_TAG=%s\nPREPARED_REVISION=%s\n' "$PREPARED_TAG" "$PREPARED_REVISION" >>"$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download the prepared set of this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: axiom-release-${{ env.PREPARED_TAG }}
          path: ${{ runner.temp }}/prepared
      - name: Download the acceptance Evidence of this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: axiom-acceptance-${{ env.PREPARED_TAG }}-*
          path: ${{ runner.temp }}/downloaded
      - name: Verify the acceptance Evidence binding
        run: |
          acceptance="$RUNNER_TEMP/acceptance"
          mkdir "$acceptance"
          ./scripts/verify-release-acceptance.py rows | while IFS= read -r row; do
            mkdir "$acceptance/$row"
            cp "$RUNNER_TEMP/downloaded/axiom-acceptance-$PREPARED_TAG-$row/gate-evidence.json" "$acceptance/$row/gate-evidence.json"
          done
          ./scripts/verify-release-acceptance.py verify --acceptance "$acceptance" --artifacts "$RUNNER_TEMP/prepared/artifacts" \
            --tag "$PREPARED_TAG" --revision "$PREPARED_REVISION" --repo "$GITHUB_REPOSITORY" --prepared-run "$GITHUB_RUN_ID" \
            | tee -a "$GITHUB_STEP_SUMMARY"
