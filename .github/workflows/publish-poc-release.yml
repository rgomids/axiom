name: Publish historical POC release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-poc-release.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.1.0-poc.1
      TARGET_SHA: 242d67c4cf2d4c3efe534dd894cb56a05558e139
    steps:
      - name: Publish historical prerelease
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi

          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## Axiom POC — Historical Snapshot

          This release preserves the first **human-accepted end-to-end Axiom POC**, accepted on **2026-09-20**.

          It is intentionally published as a **pre-release**. It is a historical checkpoint, not a production-ready version or compatibility commitment.

          ### What this POC proved

          - source-local Axiom/Lingo installation;
          - `lingo` available through the user's PATH;
          - Codex Runtime bootstrap with global `$axiom-*` skills;
          - Project configuration and resolution independently of caller CWD;
          - bounded GitHub Issue Work Item integration;
          - the sequential Axiom workflow from Specification through Reconciliation and Completion;
          - explicit authority gates for external mutations;
          - durable workflow state, Evidence references, failure inspection and resume within the accepted POC scope.

          ### Important limitations

          - Codex is the only Runtime proven by this release;
          - GitHub Issues is the only Work Item Provider proven by this release;
          - workflow execution is sequential and single-agent;
          - installation is source/user-local; there is no package manager, signing, notarization or auto-update;
          - there is no remote state synchronization or multi-agent orchestration;
          - stronger persistence/recovery proof remains future hardening work, including physical power-loss durability, the complete fault matrix and hostile same-UID filesystem races.

          ### Product learnings carried into the MVP

          - guided and explicit Project configuration instead of inferring the Runtime CWD (#54);
          - Intent-driven Work Item creation with a structured draft before mutation (#55);
          - provider-visible Axiom workflow stage and bounded transition Evidence (#56);
          - inline Runtime skill selectors/arguments to avoid unnecessary conversational round trips (#57).

          ### Historical references

          - PR #52 — complete E2E Codex POC delivery;
          - PR #58 — human acceptance reconciliation;
          - PR #59 — final POC phase cleanup and MVP-discovery handoff;
          - `docs/specifications/003-e2e-codex-poc/final-report.md` — final accepted POC report.

          ### Snapshot

          Release target: `242d67c4cf2d4c3efe534dd894cb56a05558e139`

          GitHub automatically provides the source-code `.zip` and `.tar.gz` archives for this tag.
          EOF

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Axiom POC — v0.1.0-poc.1" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease
