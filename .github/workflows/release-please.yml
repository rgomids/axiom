name: Release PR
# Starts or refreshes the Release PR with Release Please: SemVer from
# Conventional Commits, CHANGELOG.md and .release-please-manifest.json.
# Merges integrate code; `$axiom-release` starts releases (ADR-0011): this
# workflow has no push trigger and runs only when `scripts/release.sh start`
# dispatches it from main with the planned version and the exact main SHA its
# preflight validated. It re-runs that preflight (release-plan.sh) on the
# same SHA and refuses before Release Please runs if main moved by dispatch
# time, a commit is inconsistent or the plan differs. Release Please reads main
# when it runs, so the required checks are dispatched only for a Release PR
# that records the planned version and is built on the validated SHA (or an
# ancestor of it). It never creates tags or GitHub Releases
# (skip-github-release); merging the Release PR only records the versioned
# state. Publication is the separately authorized publish-release.yml.

on:
  workflow_dispatch:
    inputs:
      planned_version:
        description: Version planned by release.sh start (MAJOR.MINOR.PATCH); no tag is created
        required: true
        type: string
      main:
        description: Full 40-character main SHA the release plan validated
        required: true
        type: string

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-pr:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - name: Require dispatch from main and well-formed inputs
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          PLANNED_VERSION: ${{ inputs.planned_version }}
          PLANNED_MAIN: ${{ inputs.main }}
        run: |
          [[ "$DISPATCH_REF" == refs/heads/main ]]
          [[ "$PLANNED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$PLANNED_MAIN" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$DISPATCH_SHA" != "$PLANNED_MAIN" ]]; then
            printf 'release_error: main moved since the release plan (%s, planned %s); run $axiom-release again\n' "$DISPATCH_SHA" "$PLANNED_MAIN" >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.main }}
          fetch-depth: 0
          persist-credentials: false
      - name: Re-run the release plan on the planned main
        env:
          PLANNED_VERSION: ${{ inputs.planned_version }}
        run: |
          ./scripts/release-plan.sh --main-ref HEAD >"$RUNNER_TEMP/plan.txt"
          { printf '```text\n'; cat "$RUNNER_TEMP/plan.txt"; printf '```\n'; } >>"$GITHUB_STEP_SUMMARY"
          grep -Fxq 'releasable=true' "$RUNNER_TEMP/plan.txt"
          grep -Fxq "planned_version=$PLANNED_VERSION" "$RUNNER_TEMP/plan.txt"
      - name: Create or update the Release PR
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
      - name: Run required checks on the Release PR head of the planned version
        env:
          GH_TOKEN: ${{ github.token }}
          PLANNED_VERSION: ${{ inputs.planned_version }}
          PLANNED_MAIN: ${{ inputs.main }}
        run: ./scripts/release-pr-checks.sh dispatch "$GITHUB_REPOSITORY" "$PLANNED_VERSION" "$PLANNED_MAIN"
