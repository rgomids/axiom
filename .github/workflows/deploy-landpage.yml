name: Deploy landpage to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-landpage.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deixa a publicação em andamento terminar e descarta execuções intermediárias.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Os logos são referenciados direto pela URL do GitHub no HTML,
      # então o site é publicado exatamente como está em site/.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - id: deployment
        uses: actions/deploy-pages@v4
