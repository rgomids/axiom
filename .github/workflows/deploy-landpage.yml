# Publishes the landing page in site/ to GitHub Pages. It runs only on main,
# so the deployment is observable only after merge. The token can write Pages
# and mint an OIDC token, which is why every Action is pinned to a commit SHA.
name: Deploy landing page to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-landpage.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight publication finish; superseded queued runs are dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      # Identity assets stay only in docs/assets/ and are loaded by the page
      # through absolute raw.githubusercontent.com URLs. Nothing is copied into
      # site/: the artifact is exactly the versioned content of site/.
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./site

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
