name: Deploy landpage to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/assets/**'
      - '.github/workflows/deploy-landpage.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deixa a publicação em andamento terminar e descarta execuções intermediárias.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # docs/assets/ é a fonte única dos logos; o site os consome em assets/.
      # Copiar aqui evita manter uma segunda cópia versionada no repositório.
      - name: Assemble landing page assets
        run: |
          mkdir -p site/assets
          cp docs/assets/axiom-logo.png docs/assets/axiom-logo-github.png site/assets/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - id: deployment
        uses: actions/deploy-pages@v4
