name: CI
# One direct PR gate whose own exit status is the required "PR Checks" context
# in .github/rulesets/main.json. Native Linux/macOS race suites, release
# contracts and upgrade journeys run in native-suite.yml (nightly, manual
# qualification and release-artifacts.yml), not here. It does not run on push
# to main: the strict required-checks policy merges a PR only when its head is
# up to date with main, so the merge commit has the tree that already passed,
# and release.sh resolves a main commit's CI from that PR head.
# workflow_dispatch lets the Release Please workflow run CI on its Release PR
# branch (events created with GITHUB_TOKEN start no other workflow runs) and
# lets a maintainer run CI on a main commit that has no merged PR.
# Read-only token; this workflow never publishes anything.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-checks:
    name: PR Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOWORK: off
      GOFLAGS: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Delivery regression contracts inspect committed correction SHAs.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting
        run: ./scripts/check-go-quality.sh format
      - name: Module tidiness
        run: ./scripts/check-go-quality.sh tidy
      - name: Module verification
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Install pinned Staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
      - name: Curated static analysis
        run: ./scripts/check-go-quality.sh staticcheck
      - name: Quality gate regression contracts
        run: python3 scripts/test-go-quality.py
      - name: Delivery metadata regression contracts
        run: ./scripts/test-delivery.sh && ./scripts/test-delivery-correction.sh
      - name: Build
        run: go build ./...
      - name: Private synthetic probe state
        run: |
          probe_state="$(mktemp -d "$HOME/axiom-fake-probe.XXXXXX")"
          echo "AXIOM_TEST_PROBE_STATE_ROOT=$probe_state" >> "$GITHUB_ENV"
      - name: Tests
        run: go test ./...
      - name: Installed documentation journey
        run: ./scripts/test-docs-offline.sh
      - name: Repository and sensitive-file checks
        run: ./scripts/validate-repository.sh .
