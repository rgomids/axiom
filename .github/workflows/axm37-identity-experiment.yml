name: AXM-37 temporary identity experiment
on:
  push:
    branches: [docs/axm-37-offline-operational-documentation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity:
    if: github.ref == 'refs/heads/docs/axm-37-offline-operational-documentation'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Native identity and reader primitives
        env:
          EXPERIMENT_SHA: ${{ github.sha }}
          EXPERIMENT_RUNNER: ${{ matrix.runner }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'source=%s runner=%s\n' "$EXPERIMENT_SHA" "$EXPERIMENT_RUNNER"
          python3 - <<'PYPROBE'
          import fcntl, hashlib, json, os, pathlib, platform, shutil, subprocess, tempfile
          C = r'''
          #include <stdio.h>
          #include <stdlib.h>
          #include <unistd.h>
          #include <fcntl.h>
          #include <sys/stat.h>
          #ifdef __APPLE__
          #include <libproc.h>
          #include <stdint.h>
          #endif
          #ifndef TAG
          #define TAG "A"
          #endif
          int main(int argc, char **argv) {
              struct stat image, pin, now;
              int fd;
          #ifdef __APPLE__
              struct proc_regionwithpathinfo r;
              if (proc_pidinfo(getpid(), PROC_PIDREGIONPATHINFO, (uint64_t)(uintptr_t)&main, &r, sizeof r) != sizeof r) return 3;
              image.st_dev = r.prp_vip.vip_vi.vi_stat.vst_dev;
              image.st_ino = r.prp_vip.vip_vi.vi_stat.vst_ino;
              fd = open(argv[1], O_RDONLY);
          #else
              fd = open("/proc/self/exe", O_RDONLY);
              if (fd < 0 || fstat(fd, &image)) return 3;
          #endif
              if (fd < 0 || fstat(fd, &pin)) return 3;
              printf("%s %llu %llu %llu %llu\n", TAG, (unsigned long long)image.st_dev, (unsigned long long)image.st_ino, (unsigned long long)pin.st_dev, (unsigned long long)pin.st_ino);
              fflush(stdout);
              if (getchar() != '\n') return 4;
          #ifdef __APPLE__
              if (proc_pidinfo(getpid(), PROC_PIDREGIONPATHINFO, (uint64_t)(uintptr_t)&main, &r, sizeof r) != sizeof r) return 3;
              image.st_dev = r.prp_vip.vip_vi.vi_stat.vst_dev;
              image.st_ino = r.prp_vip.vip_vi.vi_stat.vst_ino;
          #else
              int live = open("/proc/self/exe", O_RDONLY);
              if (live < 0 || fstat(live, &image)) return 3;
              close(live);
          #endif
              if (fstat(fd, &pin)) return 3;
              int exists = stat(argv[1], &now) == 0;
              printf("%s %llu %llu %llu %llu %d %llu %llu %llu\n", TAG, (unsigned long long)image.st_dev, (unsigned long long)image.st_ino, (unsigned long long)pin.st_dev, (unsigned long long)pin.st_ino, exists, exists ? (unsigned long long)now.st_dev : 0, exists ? (unsigned long long)now.st_ino : 0, (unsigned long long)pin.st_nlink);
              close(fd);
              return 0;
          }
          '''
          def digest(p):
              return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          def start(exe, target, env=None):
              p = subprocess.Popen([str(exe), str(target)], stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True, env=env)
              initial = p.stdout.readline().split()
              assert len(initial) == 5, initial
              return p, initial
          def finish(p):
              out, _ = p.communicate('\n', timeout=10)
              assert p.returncode == 0, p.returncode
              row = out.split()
              assert len(row) == 9, row
              return row
          results = {'os': platform.platform(), 'machine': platform.machine(), 'kernel': platform.release(), 'cases': [], 'source_sha256': hashlib.sha256(C.encode()).hexdigest()}
          with tempfile.TemporaryDirectory(prefix='axm37-proof-') as tmp:
              root = pathlib.Path(tmp)
              (root / 'probe.c').write_text(C)
              results['compiler'] = subprocess.check_output(['cc', '--version'], text=True).splitlines()[0]
              results['filesystem'] = subprocess.check_output(['stat', '-f', '-c', '%T', tmp], text=True).strip() if platform.system() == 'Linux' else subprocess.check_output(['diskutil', 'info', subprocess.check_output(['df', tmp], text=True).splitlines()[-1].split()[0]], text=True).split('File System Personality:')[-1].splitlines()[0].strip()
              for tag in ['A', 'B']:
                  subprocess.run(['cc', '-O0', '-DTAG="' + tag + '"', str(root / 'probe.c'), '-o', str(root / tag)], check=True)
              results['binary_sha256'] = {t: digest(root / t) for t in ['A', 'B']}
              assert results['binary_sha256']['A'] != results['binary_sha256']['B']
              for case in ['explicit', 'safe-symlink-spaces', 'switched-PATH', 'unlink', 'changed-ancestry', 'hardlink', 'relocation', 'copy']:
                  d = root / case / 'bin space'
                  d.mkdir(parents=True)
                  target = d / 'axiom'
                  shutil.copy2(root / 'A', target)
                  exe = target
                  if case == 'safe-symlink-spaces':
                      exe = d / 'alias'
                      exe.symlink_to('axiom')
                  if case == 'hardlink':
                      exe = d / 'hard'
                      os.link(target, exe)
                  env = os.environ.copy()
                  env['PATH'] = str(d) + os.pathsep + env['PATH']
                  if case == 'switched-PATH':
                      exe = 'axiom'
                  p, before = start(exe, target, env)
                  expected = tuple(before[1:3])
                  assert before[3:5] == before[1:3], (case, before)
                  if case == 'changed-ancestry':
                      d.rename(d.with_name('old bin'))
                      d.mkdir()
                  elif case == 'unlink':
                      target.unlink()
                  elif case == 'relocation':
                      target.rename(d / 'moved')
                  elif case == 'copy':
                      shutil.copy2(target, d / 'copied')
                  staged = d / 'candidate'
                  shutil.copy2(root / 'B', staged)
                  os.replace(staged, target)
                  after = finish(p)
                  assert after[0] == 'A' and tuple(after[1:3]) == expected and tuple(after[3:5]) == expected, (case, before, after)
                  assert tuple(after[6:8]) != expected, (case, after)
                  assert digest(target) == results['binary_sha256']['B']
                  b, fresh = start(target, target)
                  fresh_end = finish(b)
                  assert fresh[0] == 'B' and fresh[1:3] == after[6:8] and fresh_end[1:3] == fresh[1:3]
                  results['cases'].append({'case': case, 'image_survives': True, 'pin_matches_os_image': True, 'pathname_control_rejected': True, 'fresh_B': True, 'hardlink_refusal_input': case == 'hardlink' and int(after[8]) > 1})
              docs = root / 'docs'
              docs.mkdir()
              content = docs / 'index.md'
              content.write_bytes(b'generation A\n')
              expected_hash = digest(content)
              fd = os.open(content, os.O_RDONLY | os.O_NOFOLLOW)
              replacement = docs / 'replacement'
              replacement.write_bytes(b'generation B\n')
              os.replace(replacement, content)
              pinned = os.read(fd, 1024)
              assert hashlib.sha256(pinned).hexdigest() == expected_hash and digest(content) != expected_hash
              os.close(fd)
              fd = os.open(content, os.O_RDONLY | os.O_NOFOLLOW)
              before_hash = digest(content)
              content.write_bytes(b'mutated in place\n')
              assert hashlib.sha256(os.read(fd, 1024)).hexdigest() != before_hash
              os.close(fd)
              results['reader'] = {'renamed_leaf_pinned_A': True, 'unchecked_reopen_rejected': True, 'in_place_mutation_hash_rejected': True, 'scope': 'single-file primitive; complete inventory reader NOT_RUN'}
              lock = root / 'installation.lock'
              for name in ['receipts-A', 'receipts-B']:
                  (root / name).mkdir()
              fd = os.open(lock, os.O_RDWR | os.O_CREAT | os.O_NOFOLLOW, 0o600)
              fcntl.flock(fd, fcntl.LOCK_EX | fcntl.LOCK_NB)
              contender = 'import fcntl,os,sys\nf=os.open(sys.argv[1],os.O_RDWR)\ntry:\n fcntl.flock(f,fcntl.LOCK_EX|fcntl.LOCK_NB)\nexcept BlockingIOError:\n sys.exit(7)\n'
              busy = subprocess.run(['python3', '-c', contender, str(lock), str(root / 'receipts-B')]).returncode
              assert busy == 7
              fcntl.flock(fd, fcntl.LOCK_UN)
              free = subprocess.run(['python3', '-c', contender, str(lock), str(root / 'receipts-B')]).returncode
              assert free == 0
              os.close(fd)
              results['lock'] = {'distinct_receipt_roots_contend': True, 'busy_exit': busy, 'after_release_exit': free, 'scope': 'shared-file flock primitive; identity derivation/revision/production publication NOT_RUN'}
          print(json.dumps(results, sort_keys=True))
          PYPROBE
