schemaVersion: 1
project: {id: 12345678-1234-4abc-8def-123456789abc, slug: sample, name: Sample}
repositories:
  - {key: web, remote: 'git@OTHER.example:Team/Web.git'}
  - {key: local}
  - {key: api, remote: 'HTTPS://EXAMPLE.COM/Org/API.git'}
runtime: {id: opaque-runtime}
providers: [{key: work, id: Opaque/Provider}, {key: other, id: unconfigured}]
integrations:
  - key: request-only
  - key: issues
    providerRef: work
    capabilities: [read-work, write-work]
    transport: {id: opaque-transport, reference: logical-binding}
    credentialRef: work-ref
modelProfiles:
  - {key: later, state: unconfigured}
  - {key: draft, runtimeRef: opaque-runtime, model: Opaque/Model}
businessContext:
  text: 'Propósito: ${SYNTHETIC_NAME} is data.'
  documents: [context/purpose.md, context/glossary.md]
credentialReferences: [{key: work-ref, sourceHint: environment}, {key: other-ref}]
policies: [policies/review.md]
