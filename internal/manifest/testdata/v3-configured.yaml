schemaVersion: 3
project: {id: 12345678-1234-4abc-8def-123456789abc, slug: sample, name: Sample}
repositories:
  - key: web
  - key: core
    remote: https://GitHub.com/example/core.git
runtimes:
  - id: claude
modelProfiles:
  - key: careful
    runtimeRef: claude
    model: Approved Model
runtimePreferences:
  - role: implementation
    complexity: high
    modelProfileRef: careful
providers:
  - key: work-items
    id: github
integrations:
  - key: work-items
    providerRef: work-items
    capabilities: [work-item]
technologyContext:
  - key: language.go
    value: go
  - key: infrastructure.terraform
    value: terraform
documentationSources:
  - key: product-notes
    kind: local-file
  - key: architecture
    kind: repository
    repositoryRef: core
    path: docs/architecture
businessContext:
  text: Bounded product context.
  documents: [context/legacy.md]
  sourceRefs: [product-notes, architecture]
  glossary:
    - key: work-item
      term: Work Item
      definition: |-
        A bounded unit of engineering intent.
        Tracked by Axiom.
    - key: execution
      term: Execution
      definition: One delivery run.
