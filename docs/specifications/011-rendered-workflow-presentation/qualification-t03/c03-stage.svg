  <g font-size="11" fill="#0f172a">
    <text x="20" y="692" font-size="12" font-weight="bold">Derived from declared edges only (not observed execution):</text>
    <text x="20" y="710">• Only root: agent-00. agent-NN declares every earlier agent-00 … agent-(NN−1); its predecessor count = NN.</text>
    <text x="20" y="728">• Every pair of Agents is ordered → one chain; at most one Agent is dependency-eligible at any point.</text>
    <text x="20" y="746">• Concurrency 32 is a declared cap only; these dependencies leave no potential same-Stage parallelism.</text>
    <text x="20" y="764">• Last Agent agent-31: 31 predecessors · integrationOwner true · validationOwner true (agent-00…30: both false).</text>
    <text x="20" y="782">• Stage input source ← tasks/result (I/O provenance, not a scheduling edge) · output result (artifact, required).</text>
  </g>
  <text x="20" y="808" font-size="11" font-style="italic" fill="#475569">Declarations only: no Execution, progress, resolved Runtime/model/Profile, validator outcome or gate satisfaction.</text>
